<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPMS 公司版 — 環境與模組</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <p class="brand">SPMS · 公司版</p>
    <h1>本機環境與模組</h1>
    <p class="intro">Python 網站服務＋本機 SQLite。此頁不會連接 Supabase 或其他外部服務。</p>
    <p><a href="/repairs/">進入備品管理（SQLite 離線功能驗收版）</a></p>
    <section aria-labelledby="connection-title">
      <h2 id="connection-title">連線狀態</h2>
      <p id="status" role="status" aria-live="polite">正在檢查…</p>
      <dl>
        <dt>主資料庫</dt><dd>SQLite（本機）</dd>
        <dt>SQLite 版本</dt><dd id="sqlite-version">—</dd>
        <dt>結構版本</dt><dd id="schema-version">—</dd>
        <dt>備品管理模組</dt><dd id="repairs-module">—</dd>
        <dt>首次建立時間（UTC）</dt><dd id="initialized-at">—</dd>
        <dt>存取範圍</dt><dd>僅這台電腦</dd>
      </dl>
      <button id="refresh" type="button">重新檢查</button>
    </section>
    <aside>
      <strong>備品管理正在分段移植；機台管理模組預留，尚未安裝。</strong>
      <p>可驗證送修、DBN／Socket、附件、結案／再次送修、S/N 及基礎對應維護、異動紀錄與統計。舊資料尚未匯入，登入權限及正式內網部署待公司設定與 IT 核准。請勿開放防火牆或當作正式服務。</p>
    </aside>
  </main>
</body>
</html>
