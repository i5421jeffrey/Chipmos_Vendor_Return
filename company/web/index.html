<!doctype html>

<body>
  <main>
    <p class="brand">SPMS · 公司版</p>
    <h1>本機環境與模組</h1>
    <p class="intro">Python 網站服務＋本機 SQLite。此頁不會連接 Supabase 或其他外部服務。</p>
    <p><a href="/repairs/">進入備品管理（送修基本流程驗證版）</a></p>
    <section aria-labelledby="connection-title">
      <h2 id="connection-title">連線狀態</h2>
      <p id="status" role="status" aria-live="polite">正在檢查…</p>
      <dl>
        <dt>主資料庫</dt><dd>SQLite（本機）</dd>

        <dt>存取範圍</dt><dd>僅這台電腦</dd>
      </dl>
      <button id="refresh" type="button">重新檢查</button>

    <aside>
      <strong>備品管理正在分段移植；機台管理模組預留，尚未安裝。</strong>
      <p>目前可驗證送修新增／查詢／編輯及異動紀錄。DBN、Socket、附件、結案／再次送修、完整主檔維護、統計、舊資料匯入、登入及內網部署尚未完成。請勿開放防火牆或當作正式服務。</p>
    </aside>
  </main>
