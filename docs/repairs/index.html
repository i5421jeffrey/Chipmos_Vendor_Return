<body>
  <div class="app">
    <aside class="sidebar"><div class="brand"><div class="brand-mark"><img src="ghost-logo.png" alt=""></div><div><div class="brand-title">備品管理系統</div></div></div><div><div class="nav-label">紀錄項目</div><nav class="nav" id="side-nav" aria-label="紀錄類型"></nav></div></aside>
    <main class="main">
      <section class="content"><div id="notice" class="notice" role="status" hidden></div><div class="page-title-row"><div><h1 class="page-title">備品管理系統</h1><div id="page-subtitle" class="page-subtitle">追蹤送修狀態、是否開單、設備與 Fail Log</div></div><div class="title-actions"><span id="demo-tag" class="public-tag" hidden>示例資料</span><button id="open-create" class="button primary" type="button">＋ 新增送修</button><button id="open-dbn" class="button primary" type="button" hidden>＋ 新增 DBN</button></div></div>
        <div class="list-toolbar"><div class="search-wrap"><span class="search-icon">⌕</span><input id="search" class="search" type="search" placeholder="搜尋板件名稱、S/N、Model、機台編號…" aria-label="搜尋板件名稱、S/N、Model 或機台編號"></div><span id="list-count" class="list-count">—</span></div>
        <div class="list-heading" id="issue-heading"><span>項目</span><span>目前狀態</span><span>機台</span><span id="date-heading">日期</span></div><div id="issue-list" class="rows" aria-label="送修清單"></div>
      </section>
    </main>
  </div>
  <div id="create-modal" class="modal-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="create-title">
      <div class="modal-head"><h2 id="create-title">新增送修資料</h2><button id="close-create" class="icon-button" type="button" aria-label="關閉">✕</button></div>
      <form id="create-form" class="record-form">
        <div class="form-grid">
          <div class="form-field"><label for="new-serial">S/N</label><input id="new-serial" name="serial_no" type="text" inputmode="numeric" maxlength="9" pattern="[0-9]{9}" title="請輸入 9 位數字；不足 9 位會自動補前導 0" placeholder="001234567" required></div>
          <div class="form-field"><label for="new-machine">機台編號</label><select id="new-machine" name="machine_code" required disabled><option value="">請先輸入S/N</option></select></div>
          <div class="form-field"><label for="new-model">Model</label><input id="new-model" name="model" type="text" readonly required></div>
          <div class="form-field"><label for="new-description">板件名稱</label><select id="new-description" name="description" required disabled><option value="">-</option></select></div>
          <div class="form-field"><label for="new-part">Part Number</label><input id="new-part" name="board_part_code" type="text" readonly required></div>
          <div class="form-field wide"><label>Fail Log 附件</label><input id="new-file-input" type="file" accept=".txt,.asc,text/plain" hidden><button id="new-file-button" class="button" type="button">＋ 上傳 Fail Log</button><div id="new-file-name" class="file-hint">尚未選擇檔案</div><div class="file-hint">僅接受 .txt／.asc，最大 5 MB；每筆送修限一個檔案。</div></div>
          <div class="form-field"><label for="new-occurred">損壞日期</label><input id="new-occurred" name="occurred_on" type="date" required></div>
        </div>
        <div id="create-message" class="form-message" role="status" aria-live="polite"></div>
        <div class="form-actions"><button id="cancel-create" class="button" type="button">取消</button><button id="submit-create" class="button primary" type="submit">新增送修資料</button></div>
      </form>
    </section>
  </div>
  <div id="dbn-modal" class="modal-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="dbn-title">
      <div class="modal-head"><h2 id="dbn-title">新增 DBN 紀錄</h2><button id="close-dbn" class="icon-button" type="button" aria-label="關閉">✕</button></div>
      <form id="dbn-form" class="record-form">
        <div class="form-grid">
          <div class="form-field"><label for="dbn-serial">S/N</label><input id="dbn-serial" name="serial_no" type="text" inputmode="numeric" maxlength="9" pattern="[0-9]{9}" title="請輸入 9 位數字；不足 9 位會自動補前導 0" placeholder="001234567" required></div>
          <div class="form-field"><label for="dbn-machine">機台編號</label><select id="dbn-machine" name="machine_code" required disabled><option value="">請先輸入S/N</option></select></div>
          <div class="form-field"><label for="dbn-model">Model</label><input id="dbn-model" name="model" type="text" readonly required></div>
          <div class="form-field"><label for="dbn-board">板件名稱</label><select id="dbn-board" name="board_name" required disabled><option value="">-</option></select></div>
          <div class="form-field"><label for="dbn-part">Part Number</label><input id="dbn-part" name="board_part_code" type="text" readonly required></div>
          <div class="form-field"><label for="dbn-customer">客戶</label><select id="dbn-customer" name="customer_code" required><option value="">請選擇客戶</option></select></div>
          <div class="form-field"><label for="dbn-product">產品</label><select id="dbn-product" name="product_code" disabled><option value="">請先選客戶</option></select></div>
          <div class="form-field"><label for="dbn-station">站點</label><select id="dbn-station" name="station_code" disabled><option value="">請先選產品</option></select></div>
        </div>
        <div class="file-hint">DBN 僅記錄板件在指定客戶／產品／站點的問題，不會建立送修案件。QR、VB 目前沒有產品與站點對應，會以「-」顯示並保持不可選。</div>
        <div id="dbn-message" class="form-message" role="status" aria-live="polite"></div>
        <div class="form-actions"><button id="cancel-dbn" class="button" type="button">取消</button><button id="submit-dbn" class="button primary" type="submit">新增 DBN 紀錄</button></div>
      </form>
    </section>

  <script type="module">

    async function loadDbnData(){const [customerResult,combinationResult]=await Promise.all([supabase.from("dbn_customers").select("customer_code").order("customer_code"),supabase.from("dbn_valid_combinations").select("customer_code,product_code,station_code").order("customer_code").order("product_code").order("station_code")]);let recordResult=await supabase.from("dbn_records").select("id,serial_no,machine_code,model,board_name,board_part_code,customer_code,product_code,station_code,created_at").order("created_at",{ascending:false});dbnSchemaReady=!recordResult.error;dbnLegacySchema=false;if(recordResult.error){dbnLegacySchema=true;recordResult=await supabase.from("dbn_records").select("id,serial_no,customer_code,product_code,station_code,created_at").order("created_at",{ascending:false});}const failed=[customerResult,combinationResult,recordResult].find(x=>x.error);if(failed){dbnLoadError=`DBN 資料庫尚未就緒或讀取失敗：${failed.error.message}`;dbnCustomers=[];dbnCombinations=[];dbnRecords=[];}else{dbnLoadError="";dbnCustomers=customerResult.data||[];dbnCombinations=combinationResult.data||[];dbnRecords=recordResult.data||[];}render();}

    async function createDbnRecord(event){event.preventDefault();const form=byId("dbn-form"),button=byId("submit-dbn"),message=byId("dbn-message"),serialInput=byId("dbn-serial");serialInput.value=normalizeSerial(serialInput.value);if(!form.reportValidity())return;const machine=machines.find(m=>m.machine_code===byId("dbn-machine").value),board=modelBoards.find(b=>b.model===machine?.model&&b.board_name===byId("dbn-board").value);if(!machine||!board){message.textContent="請選擇有效的機台與該 Model 對應的板件名稱。";return;}const customer=byId("dbn-customer").value,product=byId("dbn-product").value,station=byId("dbn-station").value,customerHasProducts=dbnCombinations.some(x=>x.customer_code===customer);if(customerHasProducts&&!dbnCombinations.some(x=>x.customer_code===customer&&x.product_code===product&&x.station_code===station)){message.textContent="請依序選擇有效的客戶、產品與站點組合。";return;}if(!customerHasProducts&&(product||station)){message.textContent="此客戶目前沒有產品／站點，請保留空白。";return;}button.disabled=true;message.textContent="正在新增 DBN 紀錄…";const payload={serial_no:serialInput.value,machine_code:machine.machine_code,model:machine.model,board_name:board.board_name,board_part_code:board.board_part_code,customer_code:customer,product_code:product||null,station_code:station||null};const {error}=await supabase.from("dbn_records").insert(payload);button.disabled=false;if(error){message.textContent=`新增失敗：${error.message}`;return;}closeDbnModal();await loadDbnData();activeView="DBN";byId("search").value="";render();setNotice("DBN 紀錄已新增；未建立送修案件。"," ");}
    async function saveRecordEdits(event,record){event.preventDefault();const form=byId("edit-record-form"),button=byId("finish-edit"),message=byId("edit-message"),serial=byId("edit-serial_no");serial.value=normalizeSerial(serial.value);if(!form.reportValidity())return;const fd=new FormData(form),text=name=>String(fd.get(name)||"").trim(),date=name=>text(name)||null,payload={is_opened:fd.get("is_opened")==="on",repair_month:text("repair_month"),item:text("item"),area:text("area"),machine_code:text("machine_code"),model:text("model"),board_part_code:text("board_part_code"),serial_no:text("serial_no"),description:text("description"),occurred_on:date("occurred_on"),sent_on:date("sent_on"),returned_on:date("returned_on")};if(ACTIVE_STATUSES.includes(record.current_status))payload.current_status=text("current_status");button.disabled=true;message.textContent="正在儲存…";const {error}=await supabase.from("repair_records").update(payload).eq("id",record.id);button.disabled=false;if(error){message.textContent=`儲存失敗：${error.message}`;return;}Object.assign(record,payload);editingRecordId=null;render();}
    async function deleteRecord(record){const message=byId("edit-message"),button=byId("delete-record");if(!window.confirm(`即將永久刪除此筆送修資料：\n\n${record.description||"送修紀錄"} · S/N ${record.serial_no||"—"}\n\n相關 Fail Log 也會一併移除。此操作無法復原，確定刪除？`))return;button.disabled=true;byId("cancel-edit").disabled=true;byId("finish-edit").disabled=true;message.textContent="正在刪除資料…";const {data:attachment,error:attachmentError}=await supabase.from("repair_attachments").select("storage_path").eq("repair_record_id",record.id).maybeSingle();if(attachmentError){button.disabled=false;byId("cancel-edit").disabled=false;byId("finish-edit").disabled=false;message.textContent=`讀取 Fail Log 資訊失敗，資料未刪除：${attachmentError.message}`;return;}const {data:deleted,error}=await supabase.from("repair_records").delete().eq("id",record.id).select("id").maybeSingle();if(error||!deleted){button.disabled=false;byId("cancel-edit").disabled=false;byId("finish-edit").disabled=false;message.textContent=error?`刪除失敗：${error.message}`:"找不到此筆資料，可能已被刪除；請重新整理。";return;}let cleanupError="";if(attachment?.storage_path){const {error:storageError}=await supabase.storage.from(BUCKET).remove([attachment.storage_path]);if(storageError)cleanupError=storageError.message;}records=records.filter(item=>item.id!==record.id);selectedId=records[0]?.id||null;editingRecordId=null;showDetail=records.length>0;render();setNotice(cleanupError?`送修資料已刪除，但 Fail Log 檔案清理失敗：${cleanupError}`:"送修資料與相關 Fail Log 已刪除。",cleanupError?"error":"");}
    async function copyFailLog(fromId,toId){const {data:attachment,error}=await supabase.from("repair_attachments").select("storage_path,filename,file_size,content_type").eq("repair_record_id",fromId).maybeSingle();if(error)return `讀取原 Fail Log 失敗：${error.message}`;if(!attachment)return "";const {data:blob,error:downloadError}=await supabase.storage.from(BUCKET).download(attachment.storage_path);if(downloadError)return `下載原 Fail Log 失敗：${downloadError.message}`;const ext=attachment.filename.split(".").pop().toLowerCase(),path=`${toId}/${crypto.randomUUID()}.${ext}`;const {error:uploadError}=await supabase.storage.from(BUCKET).upload(path,blob,{contentType:attachment.content_type||"text/plain",upsert:false});if(uploadError)return `複製 Fail Log 失敗：${uploadError.message}`;const {error:metaError}=await supabase.from("repair_attachments").insert({repair_record_id:toId,storage_path:path,filename:attachment.filename,file_size:attachment.file_size,content_type:attachment.content_type||"text/plain"});if(metaError){await supabase.storage.from(BUCKET).remove([path]);return `Fail Log 檔案複製成功但索引寫入失敗：${metaError.message}`;}return "";}
    async function finishVerification(record,passed){if(!passed&&!window.confirm(`將此案件結案為 FAIL，並建立同 S/N 的新待送修案件。\n\nFail Log 會複製到新案件，原案件保留不變。\n\n確定繼續？`))return;const buttons=[byId("resolve-pass"),byId("resolve-fail")].filter(Boolean);buttons.forEach(b=>b.disabled=true);const {data,error}=await supabase.rpc("finish_repair_verification",{p_record_id:record.id,p_passed:passed});if(error){buttons.forEach(b=>b.disabled=false);setNotice(`驗證結果儲存失敗：${error.message}`,"error");return;}const today=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());record.current_status=passed?CLOSED_PASS:CLOSED_FAIL;record.closed_on=today;if(passed){setNotice("已記錄 PASS，案件已結案。");render();return;}const newId=String(data||"").replace(/^"|"$/g,"");if(!newId){setNotice("原案件已結案 FAIL，但資料庫未回傳新案件編號；請重新載入並確認 Supabase 歷程資料。");await loadRecords();return;}const copyError=await copyFailLog(record.id,newId);const columns="id,current_status,order_status,is_opened,repair_month,item,area,machine_code,model,tester_id,board_part_code,serial_no,description,occurred_on,sent_on,returned_on,closed_on,retry_of_record_id,created_at,updated_at";const {data:newRecord,error:readError}=await supabase.from("repair_records").select(columns).eq("id",newId).single();if(readError){setNotice(`再次送修案件已建立，但讀取新案件失敗：${readError.message}`);await loadRecords();return;}records.unshift({...newRecord,is_opened:!!newRecord.is_opened});selectedId=newId;activeView="待送修";showDetail=true;editingRecordId=null;setNotice(copyError?`已建立再次送修案件，但附件複製未完成：${copyError}`:"已結案 FAIL，並建立已帶入資料與 Fail Log 的新待送修案件。",copyError?"error":"");render();}

    async function createRecord(event){event.preventDefault();const form=byId("create-form"),button=byId("submit-create"),message=byId("create-message"),serialInput=byId("new-serial"),file=byId("new-file-input").files?.[0];serialInput.value=normalizeSerial(serialInput.value);if(!form.reportValidity())return;if(file&&!validFailLog(file)){message.textContent="Fail Log 格式或大小不符；僅接受非空的 .txt／.asc 檔案，最大 5 MB。";return;}const fd=new FormData(form),value=name=>String(fd.get(name)||"").trim();button.disabled=true;byId("new-file-button").disabled=true;message.textContent="正在新增…";const payload={current_status:"待送修",order_status:"",is_opened:false,repair_month:"",item:"",area:"",machine_code:value("machine_code"),model:value("model"),board_part_code:value("board_part_code"),serial_no:value("serial_no"),description:value("description"),occurred_on:value("occurred_on"),sent_on:null,returned_on:null,source_system:"web",source_record_id:null};const {data,error}=await supabase.from("repair_records").insert(payload).select("id,current_status,order_status,is_opened,repair_month,item,area,machine_code,model,tester_id,board_part_code,serial_no,description,occurred_on,sent_on,returned_on,closed_on,retry_of_record_id,created_at,updated_at").single();if(error){button.disabled=false;byId("new-file-button").disabled=false;message.textContent=`新增失敗：${error.message}`;return;}let uploadError="";if(file)uploadError=await storeAttachment(data,file);records.unshift({...data,is_opened:!!data.is_opened});selectedId=data.id;activeView="全部";showDetail=true;form.reset();closeCreateModal();render();if(uploadError)setNotice(`送修資料已新增，但 Fail Log 上傳失敗：${uploadError}`,"error");}
    async function loadAttachment(record,demo){const box=byId("attachment-box"),request=++attachmentRequest;if(!box)return;if(demo){box.innerHTML='<div class="file-hint">此示例紀錄尚無附件。正式資料載入後可上傳 TXT／ASC（最多 5 MB）。</div><button class="button" type="button" id="upload-file" disabled>上傳 Fail Log</button>';return;}box.innerHTML='<div class="file-hint">載入附件中…</div>';const {data,error}=await supabase.from("repair_attachments").select("id,repair_record_id,storage_path,filename,file_size,content_type,created_at").eq("repair_record_id",record.id).maybeSingle();if(request!==attachmentRequest||!byId("attachment-box"))return;if(error){box.innerHTML=`<div class="error-text">附件讀取失敗：${esc(error.message)}</div>`;return;}if(!data){box.innerHTML='<div class="file-hint">尚未上傳 Fail Log</div><input id="file-input" type="file" accept=".txt,.asc,text/plain" hidden><button class="button primary" type="button" id="upload-file">＋ 上傳 Fail Log</button><div class="file-hint">僅接受 .txt／.asc，最大 5 MB；每筆送修限一個檔案。</div>';byId("upload-file").addEventListener("click",()=>byId("file-input").click());byId("file-input").addEventListener("change",e=>{if(e.target.files?.[0])uploadAttachment(record,e.target.files[0]);});return;}
      const size=(data.file_size/1024).toFixed(data.file_size<10240?1:0);box.innerHTML=`<div class="file-name">${esc(data.filename)}</div><div class="file-meta">${size} KB · ${esc(new Date(data.created_at).toLocaleString("zh-TW"))}</div><div class="attachment-actions"><button class="button" id="view-file" type="button">檢視文字</button><a class="button" href="${esc(supabase.storage.from(BUCKET).getPublicUrl(data.storage_path).data.publicUrl)}" target="_blank" rel="noopener">下載</a><button class="button danger" id="delete-file" type="button">刪除附件</button></div><pre id="file-preview" class="file-preview" hidden></pre><div id="file-message" class="file-hint"></div>`;
      byId("view-file").addEventListener("click",async()=>{const p=byId("file-preview"),m=byId("file-message");p.hidden=false;p.textContent="載入中…";const {data:blob,error:downloadError}=await supabase.storage.from(BUCKET).download(data.storage_path);if(downloadError){p.textContent="";m.textContent=`檔案讀取失敗：${downloadError.message}`;return;}p.textContent=await blob.text();});
      byId("delete-file").addEventListener("click",()=>deleteAttachment(data));
    }
    function validFailLog(file){const ext=file.name.split(".").pop().toLowerCase();return ["txt","asc"].includes(ext)&&file.size>0&&file.size<=MAX_FILE_SIZE;}
    async function storeAttachment(record,file){const ext=file.name.split(".").pop().toLowerCase(),path=`${record.id}/${crypto.randomUUID()}.${ext}`;const {error:uploadError}=await supabase.storage.from(BUCKET).upload(path,file,{contentType:"text/plain",upsert:false});if(uploadError)return uploadError.message;const {error:metaError}=await supabase.from("repair_attachments").insert({repair_record_id:record.id,storage_path:path,filename:file.name,file_size:file.size,content_type:"text/plain"});if(metaError){await supabase.storage.from(BUCKET).remove([path]);return metaError.message;}return "";}
    async function uploadAttachment(record,file){const message=byId("attachment-box");if(!validFailLog(file)){message.insertAdjacentHTML("beforeend",'<div class="error-text">格式或大小不符；僅接受非空的 .txt／.asc 檔案，最大 5 MB。</div>');return;}message.innerHTML='<div class="file-hint">正在上傳…</div>';const error=await storeAttachment(record,file);if(error){message.innerHTML=`<div class="error-text">上傳失敗：${esc(error)}</div>`;return;}await loadAttachment(record,false);}
    async function deleteAttachment(attachment){if(!window.confirm(`即將永久刪除 Fail Log：\n\n${attachment.filename}\n\n刪除後無法復原。確定要刪除嗎？`))return;const msg=byId("file-message");byId("delete-file").disabled=true;msg.textContent="正在刪除…";const {error:storageError}=await supabase.storage.from(BUCKET).remove([attachment.storage_path]);if(storageError){msg.textContent=`刪除失敗：${storageError.message}`;byId("delete-file").disabled=false;return;}const {error:rowError}=await supabase.from("repair_attachments").delete().eq("id",attachment.id);if(rowError){msg.textContent=`檔案已刪除，但附件索引更新失敗：${rowError.message}`;return;}const row=records.find(r=>r.id===attachment.repair_record_id);if(row)await loadAttachment(row,false);}
    byId("search").addEventListener("input",render);byId("issue-list").addEventListener("click",e=>{const dbnLink=e.target.closest("[data-dbn-serial]");if(dbnLink){e.preventDefault();e.stopPropagation();openDbnForSerial(dbnLink.dataset.dbnSerial);return;}const row=e.target.closest("[data-id]");if(!row)return;selectedId=row.dataset.id;showDetail=true;render();});byId("issue-list").addEventListener("keydown",e=>{const dbnLink=e.target.closest("[data-dbn-serial]");if(dbnLink&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.stopPropagation();openDbnForSerial(dbnLink.dataset.dbnSerial);}});byId("close-detail").addEventListener("click",()=>{showDetail=false;editingRecordId=null;renderDetail(null);});byId("detail-backdrop").addEventListener("click",()=>{showDetail=false;editingRecordId=null;renderDetail(null);});
    byId("open-create").addEventListener("click",openCreateModal);byId("close-create").addEventListener("click",closeCreateModal);byId("cancel-create").addEventListener("click",closeCreateModal);byId("create-modal").addEventListener("click",e=>{if(e.target===byId("create-modal"))closeCreateModal();});byId("create-form").addEventListener("submit",createRecord);byId("new-file-button").addEventListener("click",()=>byId("new-file-input").click());byId("new-file-input").addEventListener("change",e=>{const file=e.target.files?.[0];byId("new-file-name").textContent=file?file.name:"尚未選擇檔案";byId("create-message").textContent=file&&!validFailLog(file)?"Fail Log 格式或大小不符；僅接受非空的 .txt／.asc 檔案，最大 5 MB。":"";});byId("new-serial").addEventListener("input",updateMachineAvailability);byId("new-serial").addEventListener("blur",e=>{e.target.value=normalizeSerial(e.target.value);updateMachineAvailability();});byId("new-machine").addEventListener("change",updateNewMachine);byId("new-description").addEventListener("change",updateNewBoardPart);byId("open-dbn").addEventListener("click",openDbnModal);byId("close-dbn").addEventListener("click",closeDbnModal);byId("cancel-dbn").addEventListener("click",closeDbnModal);byId("dbn-modal").addEventListener("click",e=>{if(e.target===byId("dbn-modal"))closeDbnModal();});byId("dbn-form").addEventListener("submit",createDbnRecord);byId("dbn-serial").addEventListener("input",updateDbnMachineAvailability);byId("dbn-serial").addEventListener("blur",e=>{e.target.value=normalizeSerial(e.target.value);updateDbnMachineAvailability();});byId("dbn-machine").addEventListener("change",updateDbnMachine);byId("dbn-board").addEventListener("change",updateDbnPart);byId("dbn-customer").addEventListener("change",updateDbnProducts);byId("dbn-product").addEventListener("change",updateDbnStations);document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!byId("create-modal").hidden)closeCreateModal();if(!byId("dbn-modal").hidden)closeDbnModal();}});
