<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101113">
  <title>備品送修管理</title>
  <style>
    :root{color-scheme:dark;--bg:#101113;--side:#151618;--panel:#191a1c;--raised:#202124;--line:#292a2d;--text:#e7e7e8;--muted:#88898d;--soft:#b5b6ba;--accent:#8b8df8;--green:#65c98a;--yellow:#e3b341;--red:#ef7777;--purple:#bd91f4}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}
    .app{min-height:100vh;display:grid;grid-template-columns:218px minmax(0,1fr)}.sidebar{background:var(--side);border-right:1px solid var(--line);padding:17px 11px;display:flex;flex-direction:column;gap:20px}.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 8px}.brand-mark{width:25px;height:25px;border-radius:7px;background:linear-gradient(140deg,#9c9eff,#665ed0);display:grid;place-items:center;color:white;font-weight:700;font-size:12px}.brand-title{font-weight:600;font-size:13px}.brand-sub{font-size:10px;color:var(--muted);margin-top:1px}.workspace{margin:0 2px;border:1px solid var(--line);border-radius:6px;padding:9px 10px;color:var(--soft);display:flex;justify-content:space-between;align-items:center}.workspace span:last-child{color:var(--muted)}.nav-label{font-size:10px;font-weight:600;letter-spacing:.08em;color:#707176;text-transform:uppercase;padding:0 9px 5px}.nav{display:grid;gap:2px}.nav-item{width:100%;border:0;background:transparent;text-align:left;color:#aaaab0;border-radius:5px;padding:7px 9px;display:flex;align-items:center;gap:9px}.nav-item:hover{background:#202124;color:var(--text)}.nav-item[aria-current="page"]{background:#28292c;color:#f2f2f3}.nav-icon{width:15px;text-align:center;color:#85868c;font-size:13px}.nav-name{flex:1}.count{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:#77787e}.sidebar-bottom{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 0;color:var(--muted);font-size:11px}.phase{display:inline-flex;gap:6px;align-items:center;color:#a7a8ff;font-size:10px}.phase:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
    .main{min-width:0}.topbar{height:53px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 23px;gap:16px}.crumb{color:var(--muted);font-size:12px}.crumb strong{color:var(--soft);font-weight:500}.top-actions{display:flex;align-items:center;gap:8px}.icon-button,.button{border:1px solid var(--line);background:transparent;color:#b9b9bd;border-radius:5px;padding:6px 9px}.icon-button:hover,.button:hover{background:var(--raised);color:white}.button.primary{background:#353569;border-color:#45457b;color:#e5e5ff}.auth{display:flex;align-items:center;gap:6px}.auth input{width:190px;background:#17181a;border:1px solid var(--line);border-radius:5px;padding:6px 8px;outline:none}.auth input:focus,.search:focus,.order-select:focus{border-color:#6869b4}.auth-state{font-size:11px;color:#aaaaff}.auth-message{font-size:11px;color:var(--muted);padding:0 23px;min-height:20px}.content{max-width:1180px;margin:0 auto;padding:28px 25px 60px}.page-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin:0 0 20px}.page-title{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:0 0 4px}.page-subtitle{color:var(--muted);font-size:12px}.demo-tag{border:1px solid #665224;color:#e5c36e;background:#241f13;border-radius:4px;padding:3px 7px;font-size:10px;white-space:nowrap}.notice{margin:0 0 13px;padding:8px 10px;border:1px solid #3d3828;background:#1b1913;color:#c8b989;border-radius:5px;font-size:11px}.notice.error{border-color:#613535;background:#211616;color:#f0adad}.notice.success{border-color:#2f513c;background:#151d18;color:#a2d7b1}
    .list-toolbar{display:flex;align-items:center;gap:8px;padding:0 0 12px}.search-wrap{position:relative;flex:1;max-width:360px}.search-icon{position:absolute;left:10px;top:8px;color:#77787e}.search{width:100%;height:32px;background:#17181a;border:1px solid var(--line);border-radius:5px;padding:0 10px 0 30px;outline:none}.search::placeholder{color:#707176}.order-select{height:32px;background:#17181a;border:1px solid var(--line);border-radius:5px;padding:0 26px 0 9px;color:#aaaab0;outline:none}.list-count{margin-left:auto;color:var(--muted);font-size:11px}.list-heading{display:grid;grid-template-columns:minmax(230px,2.2fr) minmax(125px,1fr) minmax(105px,.8fr) minmax(120px,.9fr);gap:12px;padding:8px 12px;color:#73747a;font-size:10px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line)}.rows{border-bottom:1px solid var(--line)}.issue-row{width:100%;display:grid;grid-template-columns:minmax(230px,2.2fr) minmax(125px,1fr) minmax(105px,.8fr) minmax(120px,.9fr);gap:12px;align-items:center;text-align:left;border:0;border-bottom:1px solid #222326;background:transparent;padding:10px 12px;min-height:56px}.issue-row:last-child{border-bottom:0}.issue-row:hover{background:#191a1c}.issue-row.selected{background:#202124;box-shadow:inset 2px 0 var(--accent)}.issue-main{display:flex;align-items:center;gap:10px;min-width:0}.state-dot{width:8px;height:8px;border:1.5px solid #777;border-radius:50%;flex:none}.state-dot.closed{background:var(--green);border-color:var(--green)}.state-dot.working{border-color:#7cb7e8;background:#7cb7e8}.state-dot.verify{border-color:var(--yellow);background:var(--yellow)}.issue-copy{min-width:0}.issue-title{font-size:12px;color:#dedee0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.issue-sub{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;color:#77787e;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.machine-label{color:#c3c3ff;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap}.pill{display:inline-flex;align-items:center;gap:5px;width:max-content;max-width:100%;border:1px solid #343539;border-radius:4px;color:#b9b9bd;padding:2px 6px;font-size:10px;white-space:nowrap}.pill:before{content:"";width:5px;height:5px;border-radius:50%;background:#888}.pill.verify{color:#e0c477;border-color:#514525}.pill.verify:before{background:var(--yellow)}.pill.working{color:#9dc7e8;border-color:#314354}.pill.working:before{background:#79b6e7}.pill.closed{color:#8fcaa0;border-color:#2e4b37}.pill.closed:before{background:var(--green)}.row-date{color:#929398;font-size:11px;white-space:nowrap}.empty{padding:28px;text-align:center;color:var(--muted);border-bottom:1px solid var(--line)}
    .detail-backdrop{position:fixed;inset:0;background:#0008;z-index:5;display:none}.detail{position:fixed;z-index:6;right:0;top:0;bottom:0;width:min(410px,92vw);background:#151618;border-left:1px solid #333438;box-shadow:-12px 0 40px #0005;transform:translateX(102%);transition:transform .18s ease;overflow:auto}.detail.open{transform:translateX(0)}.detail-backdrop.open{display:block}.detail-head{position:sticky;top:0;background:#151618ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:13px 17px;display:flex;justify-content:space-between;align-items:center;z-index:1}.detail-head-label{font-size:11px;color:var(--muted)}.detail-content{padding:20px 20px 36px}.detail-id{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:#8a8b91;margin-bottom:8px}.detail-title{font-size:18px;line-height:1.35;margin:0 0 12px;overflow-wrap:anywhere}.detail-statuses{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}.detail-section{border-top:1px solid var(--line);padding:15px 0}.detail-section h3{font-size:10px;font-weight:600;color:#85868c;letter-spacing:.07em;text-transform:uppercase;margin:0 0 11px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px 10px}.detail-field label{display:block;font-size:10px;color:#77787e;margin-bottom:3px}.detail-field div{font-size:12px;color:#d2d2d4;overflow-wrap:anywhere}.detail-text{font-size:12px;color:#c5c5c8;white-space:pre-wrap;overflow-wrap:anywhere}.detail-hint{color:var(--muted);font-size:11px;padding:30px 20px}.mobile-nav{display:none}
    @media(max-width:800px){.app{grid-template-columns:178px minmax(0,1fr)}.sidebar{padding-left:8px;padding-right:8px}.topbar{padding:0 15px}.content{padding:23px 15px 45px}.list-heading,.issue-row{grid-template-columns:minmax(180px,1.7fr) minmax(110px,.9fr) minmax(95px,.8fr)}.list-heading>*:nth-child(3),.issue-row>*:nth-child(3){display:none}}
    @media(max-width:600px){.app{display:block}.sidebar{display:none}.mobile-nav{display:flex;gap:4px;overflow:auto;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--side)}.mobile-nav .nav-item{width:auto;white-space:nowrap;padding:6px 9px}.mobile-nav .count{margin-left:2px}.topbar{height:auto;min-height:50px;padding:9px 12px}.crumb{display:none}.auth input{width:min(43vw,185px)}.auth .button{font-size:10px;padding:6px}.top-actions{min-width:0}.auth{min-width:0}.content{padding:19px 12px 40px}.page-title{font-size:18px}.page-title-row{margin-bottom:15px}.list-toolbar{flex-wrap:wrap}.search-wrap{max-width:none;flex-basis:100%}.list-count{margin-left:0}.list-heading{display:none}.issue-row{grid-template-columns:minmax(0,1fr) auto;gap:5px 8px;padding:10px 9px}.issue-row>*:nth-child(2){grid-column:1;grid-row:2;padding-left:18px}.issue-row>*:nth-child(3){display:block;grid-column:2;grid-row:1;justify-self:end}.issue-row>*:nth-child(4){grid-column:2;grid-row:2;justify-self:end;font-size:10px}.issue-main{grid-column:1;grid-row:1}.notice{font-size:10px}.detail{width:min(430px,100vw)}.detail.open{transform:translateX(0)}}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">K</div><div><div class="brand-title">備品管理</div><div class="brand-sub">送修工作區</div></div></div>
      <div class="workspace"><span>ChipMOS · 維修</span><span>⌄</span></div>
      <div><div class="nav-label">送修項目</div><nav class="nav" id="side-nav" aria-label="送修狀態"></nav></div>
      <div class="sidebar-bottom"><span class="phase">第一階段版面測試</span><div style="margin-top:8px">雲端唯讀檢視</div></div>
    </aside>
    <main class="main">
      <div class="topbar"><div class="crumb">工作區 <span style="padding:0 7px;color:#555">/</span> <strong>送修紀錄</strong></div><div class="top-actions"><div class="auth"><input id="email" type="email" autocomplete="email" placeholder="已授權的 email" aria-label="已授權的 email"><button id="login" class="button primary" type="button">登入</button><button id="logout" class="button" type="button" hidden>登出</button><span id="login-state" class="auth-state">示例預覽</span></div></div></div>
      <div id="auth-message" class="auth-message" aria-live="polite">正式資料僅限 Supabase 授權帳號讀取。</div>
      <section class="content">
        <div id="notice" class="notice" role="status">未登入：目前顯示版面示例資料，並非正式送修紀錄。</div>
        <div class="page-title-row"><div><h1 class="page-title">送修紀錄</h1><div class="page-subtitle">追蹤送修狀態、設備與回修進度</div></div><span id="demo-tag" class="demo-tag">SAMPLE DATA</span></div>
        <div class="list-toolbar"><div class="search-wrap"><span class="search-icon">⌕</span><input id="search" class="search" type="search" placeholder="搜尋料號、序號、設備或故障內容…" aria-label="搜尋送修紀錄"></div><select id="order-filter" class="order-select" aria-label="依開單狀態篩選"><option value="">所有開單狀態</option></select><span id="list-count" class="list-count">—</span></div>
        <div class="list-heading"><span>項目</span><span>目前狀態</span><span>機台</span><span>日期</span></div>
        <div id="issue-list" class="rows" aria-label="送修清單"></div>
      </section>
    </main>
  </div>
  <nav class="mobile-nav" id="mobile-nav" aria-label="送修狀態"></nav>
  <div id="detail-backdrop" class="detail-backdrop"></div>
  <aside id="detail" class="detail" aria-label="送修詳細資料" aria-hidden="true"><div class="detail-head"><span class="detail-head-label">送修詳細資料</span><button id="close-detail" class="icon-button" type="button" aria-label="關閉詳細資料">✕</button></div><div id="detail-content" class="detail-hint">選取一筆送修紀錄查看詳細資料</div></aside>
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabase=createClient("https://ywazcutaodqrthhighod.supabase.co","sb_publishable_wu8mVnxG-ifzSDB8Zl4wlg_xCRjl9k3");
    const demoRecords=[
      {id:"demo-1",current_status:"取回驗證中",order_status:"已開單",repair_month:"202606",item:"示例 A",area:"CP",machine_code:"F20",model:"T5377S",tester_id:"TERA76",board_part_code:"DEMO-030001",serial_no:"DEMO-SN-001",description:"I/O PE（示例）",failure_data:"示例故障資料，非實際紀錄",occurred_on:"2026-06-12",sent_on:"2026-06-15",returned_on:null},
      {id:"demo-2",current_status:"已送",order_status:"已開單",repair_month:"202606",item:"示例 B",area:"CP",machine_code:"F47",model:"T5377S",tester_id:"TERA8",board_part_code:"DEMO-030002",serial_no:"DEMO-SN-002",description:"DC BOARD（示例）",failure_data:"示例測試失敗訊息",occurred_on:"2026-06-09",sent_on:"2026-06-10",returned_on:null},
      {id:"demo-3",current_status:"結案",order_status:"已開單",repair_month:"202606",item:"示例 C",area:"CP",machine_code:"F49",model:"T5377S",tester_id:"PSC118",board_part_code:"DEMO-030003",serial_no:"DEMO-SN-003",description:"FM CONT（示例）",failure_data:"示例維修完成",occurred_on:"2026-06-05",sent_on:"2026-06-06",returned_on:"2026-06-11"}
    ];
    const views=[{id:"all",label:"全部送修",icon:"▤"},{id:"active",label:"處理中",icon:"◷"},{id:"verify",label:"取回驗證",icon:"◉"},{id:"closed",label:"已結案",icon:"✓"}];
    let records=demoRecords,selectedId="demo-1",activeView="all",currentUser=null,showDetail=window.matchMedia("(min-width: 601px)").matches;
    const byId=id=>document.getElementById(id), emailInput=byId("email"), notice=byId("notice"), authMessage=byId("auth-message");
    function esc(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
    function dateText(value){if(!value)return "—";const d=new Date(`${value}T00:00:00`);return Number.isNaN(d.valueOf())?value:new Intl.DateTimeFormat("zh-TW",{month:"short",day:"numeric"}).format(d);}
    function machineLabel(r){return r.tester_id?`${r.machine_code||"—"}-${r.tester_id}`:(r.machine_code||"—");}
    function tone(r){const s=r.current_status||"";return s.includes("結案")||s.includes("完成")?"closed":s.includes("驗證")?"verify":(s.includes("送")||s.includes("處理")||s.includes("維修"))?"working":"";}
    function viewRows(){return records.filter(r=>activeView==="all"||(activeView==="active"&&!/結案|驗證|完成/.test(r.current_status||""))||(activeView==="verify"&&(r.current_status||"").includes("驗證"))||(activeView==="closed"&&((r.current_status||"").includes("結案")||(r.current_status||"").includes("完成"))));}
    function renderNav(){
      const navHTML=views.map(v=>{const n=v.id==="all"?records.length:v.id==="active"?records.filter(r=>!/(結案|驗證|完成)/.test(r.current_status||"")).length:v.id==="verify"?records.filter(r=>(r.current_status||"").includes("驗證")).length:records.filter(r=>/(結案|完成)/.test(r.current_status||"")).length;return `<button class="nav-item" type="button" data-view="${v.id}" aria-current="${activeView===v.id?"page":"false"}"><span class="nav-icon">${v.icon}</span><span class="nav-name">${v.label}</span><span class="count">${n}</span></button>`;}).join("");
      byId("side-nav").innerHTML=navHTML;byId("mobile-nav").innerHTML=navHTML;
      document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>{activeView=b.dataset.view;render();}));
    }
    function renderDetail(row,open=showDetail){
      const detail=byId("detail"),body=byId("detail-content");
      if(!row){body.className="detail-hint";body.textContent="選取一筆送修紀錄查看詳細資料";detail.classList.remove("open");byId("detail-backdrop").classList.remove("open");detail.setAttribute("aria-hidden","true");return;}
      const statusTone=tone(row);body.className="detail-content";body.innerHTML=`
        <div class="detail-id">${esc(row.repair_month||"送修紀錄")} · ${esc(row.item||"")}</div>
        <h2 class="detail-title">${esc(row.description||"未填寫 Description")}</h2>
        <div class="detail-statuses"><span class="pill ${statusTone}">${esc(row.current_status||"未設定狀態")}</span><span class="pill">開單：${esc(row.order_status||"未設定")}</span></div>
        <section class="detail-section"><h3>設備資訊</h3><div class="detail-grid">
          <div class="detail-field"><label>Machine / TesterID</label><div>${esc(machineLabel(row))}</div></div><div class="detail-field"><label>Model</label><div>${esc(row.model||"—")}</div></div>
          <div class="detail-field"><label>Area</label><div>${esc(row.area||"—")}</div></div><div class="detail-field"><label>Item</label><div>${esc(row.item||"—")}</div></div>
          <div class="detail-field"><label>Board Part Code</label><div>${esc(row.board_part_code||"—")}</div></div><div class="detail-field"><label>Serial NO</label><div>${esc(row.serial_no||"—")}</div></div>
        </div></section>
        <section class="detail-section"><h3>送修時程</h3><div class="detail-grid">
          <div class="detail-field"><label>發生日期</label><div>${esc(dateText(row.occurred_on))}</div></div><div class="detail-field"><label>送修日期</label><div>${esc(dateText(row.sent_on))}</div></div><div class="detail-field"><label>回修日期</label><div>${esc(dateText(row.returned_on))}</div></div>
        </div></section>
        <section class="detail-section"><h3>Failure Data</h3><div class="detail-text">${esc(row.failure_data||"尚無故障資料")}</div></section>`;
      detail.classList.toggle("open",open);byId("detail-backdrop").classList.toggle("open",open);detail.setAttribute("aria-hidden",String(!open));
    }
    function render(){
      const query=byId("search").value.trim().toLocaleLowerCase(),order=byId("order-filter").value;
      const filtered=viewRows().filter(r=>{const text=[r.machine_code,r.tester_id,machineLabel(r),r.board_part_code,r.serial_no,r.description,r.failure_data,r.area,r.item].join(" ").toLocaleLowerCase();return (!query||text.includes(query))&&(!order||r.order_status===order);});
      byId("list-count").textContent=`${filtered.length} 筆`;
      byId("issue-list").innerHTML=filtered.length?filtered.map(r=>`<button class="issue-row ${r.id===selectedId?"selected":""}" type="button" data-id="${esc(r.id)}" aria-pressed="${r.id===selectedId}">
        <span class="issue-main"><span class="state-dot ${tone(r)}"></span><span class="issue-copy"><span class="issue-title">${esc(r.description||"未填寫 Description")}</span><span class="issue-sub">${esc(r.board_part_code||"無料號")} · S/N ${esc(r.serial_no||"—")}</span></span></span>
        <span><span class="pill ${tone(r)}">${esc(r.current_status||"未設定")}</span></span><span class="machine-label">${esc(machineLabel(r))}</span><span class="row-date">${esc(dateText(r.sent_on||r.occurred_on))}</span>
      </button>`).join(""):'<div class="empty">沒有符合條件的送修紀錄</div>';
      renderNav();const selected=filtered.find(r=>r.id===selectedId)||filtered[0]||null;if(selected){selectedId=selected.id;byId("issue-list").querySelector(`[data-id="${CSS.escape(String(selected.id))}"]`)?.classList.add("selected");renderDetail(selected,showDetail);}else renderDetail(null);
    }
    function preview(message,kind=""){records=demoRecords;selectedId=demoRecords[0].id;byId("demo-tag").hidden=false;notice.className=`notice ${kind}`.trim();notice.textContent=message;fillOrderFilter();render();}
    function fillOrderFilter(){const select=byId("order-filter"),value=select.value;select.replaceChildren(new Option("所有開單狀態",""));[...new Set(records.map(r=>r.order_status).filter(Boolean))].sort().forEach(v=>select.add(new Option(v,v)));if([...select.options].some(o=>o.value===value))select.value=value;}
    async function loadRecords(){
      if(!currentUser){preview("未登入：目前顯示版面示例資料，並非正式送修紀錄。");return;}
      authMessage.textContent="正在讀取 Supabase…";
      const {data,error}=await supabase.from("repair_records").select("id,current_status,order_status,repair_month,item,area,machine_code,model,tester_id,board_part_code,serial_no,description,failure_data,occurred_on,sent_on,returned_on,updated_at").order("occurred_on",{ascending:false,nullsFirst:false});
      if(error){authMessage.textContent=`資料讀取失敗：${error.message}`;preview(`無法讀取 Supabase（${error.message}）。請確認已執行 supabase/repairs_setup.sql 並授權此帳號。`,"error");return;}
      records=data||[];selectedId=records[0]?.id||null;byId("demo-tag").hidden=true;fillOrderFilter();render();
      authMessage.textContent="已連線 Supabase · 唯讀";notice.className="notice success";notice.textContent=records.length?"已連線 Supabase，顯示雲端正式資料。":"已連線 Supabase；目前尚無送修紀錄。";
    }
    byId("search").addEventListener("input",render);byId("order-filter").addEventListener("change",render);
    byId("issue-list").addEventListener("click",event=>{const row=event.target.closest("[data-id]");if(!row)return;selectedId=row.dataset.id;showDetail=true;render();});
    byId("close-detail").addEventListener("click",()=>{showDetail=false;renderDetail(null);});byId("detail-backdrop").addEventListener("click",()=>{showDetail=false;renderDetail(null);});
    byId("login").addEventListener("click",async()=>{const email=emailInput.value.trim().toLowerCase();if(!email){authMessage.textContent="請輸入已授權的 email。";emailInput.focus();return;}byId("login").disabled=true;authMessage.textContent="正在寄送登入連結…";const {error}=await supabase.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:location.href}});byId("login").disabled=false;authMessage.textContent=error?`寄送失敗：${error.message}`:"若帳號已受邀，請查看信箱並點擊登入連結。";});
    byId("logout").addEventListener("click",async()=>{await supabase.auth.signOut();});
    supabase.auth.onAuthStateChange((_event,session)=>{currentUser=session?.user||null;byId("login").hidden=!!currentUser;emailInput.hidden=!!currentUser;byId("logout").hidden=!currentUser;byId("login-state").textContent=currentUser?"已登入":"示例預覽";if(currentUser)loadRecords();else preview("未登入：目前顯示版面示例資料，並非正式送修紀錄。");});
    preview("未登入：目前顯示版面示例資料，並非正式送修紀錄。");
    supabase.auth.getSession().then(({data})=>{currentUser=data.session?.user||null;byId("login").hidden=!!currentUser;emailInput.hidden=!!currentUser;byId("logout").hidden=!currentUser;byId("login-state").textContent=currentUser?"已登入":"示例預覽";loadRecords();});
  </script>
</body>
</html>
