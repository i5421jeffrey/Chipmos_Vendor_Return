<html lang="zh-Hant">

  <style>

    .app{min-height:100vh;display:grid;grid-template-columns:218px minmax(0,1fr)}.sidebar{background:var(--side);border-right:1px solid var(--line);padding:17px 11px;display:flex;flex-direction:column;gap:20px}.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 8px}.brand-mark{width:28px;height:28px;display:grid;place-items:center;flex:none}.brand-mark svg{display:block;width:28px;height:28px;fill:#a78bfa}.brand-title{font-weight:600;font-size:13px}.nav-label{font-size:10px;font-weight:600;letter-spacing:.08em;color:#707176;text-transform:uppercase;padding:0 9px 5px}.nav{display:grid;gap:2px}.nav-item{width:100%;border:0;background:transparent;text-align:left;color:#aaaab0;border-radius:5px;padding:7px 9px;display:flex;align-items:center;gap:9px}.nav-item:hover{background:#202124;color:var(--text)}.nav-item[aria-current="page"]{background:#28292c;color:#f2f2f3}.nav-icon{width:15px;text-align:center;color:#85868c;font-size:13px}.nav-name{flex:1}.count{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:#77787e}

    .list-toolbar{display:flex;align-items:center;gap:8px;padding:0 0 12px}.search-wrap{position:relative;flex:1;max-width:360px}.search-icon{position:absolute;left:10px;top:8px;color:#77787e}.search{width:100%;height:32px;background:#17181a;border:1px solid var(--line);border-radius:5px;padding:0 10px 0 30px;outline:none}.search::placeholder{color:#707176}.order-select{height:32px;background:#17181a;border:1px solid var(--line);border-radius:5px;padding:0 26px 0 9px;color:#aaaab0;outline:none}.search:focus,.order-select:focus{border-color:#6869b4}.list-count{margin-left:auto;color:var(--muted);font-size:11px}.list-heading{display:grid;grid-template-columns:minmax(230px,2.2fr) minmax(125px,1fr) minmax(105px,.8fr) minmax(120px,.9fr);gap:12px;padding:8px 12px;color:#73747a;font-size:10px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line)}.rows{border-bottom:1px solid var(--line)}.issue-row{width:100%;display:grid;grid-template-columns:minmax(230px,2.2fr) minmax(125px,1fr) minmax(105px,.8fr) minmax(120px,.9fr);gap:12px;align-items:center;text-align:left;border:0;border-bottom:1px solid #222326;background:transparent;padding:10px 12px;min-height:56px}.issue-row:last-child{border-bottom:0}.issue-row:hover{background:#191a1c}.issue-row.selected{background:#202124;box-shadow:inset 2px 0 var(--accent)}.issue-main{display:flex;align-items:center;gap:10px;min-width:0}.state-dot{width:8px;height:8px;border:1.5px solid #777;border-radius:50%;flex:none}.state-dot.closed{background:var(--green);border-color:var(--green)}.state-dot.sent{border-color:#7cb7e8;background:#7cb7e8}.state-dot.verify{border-color:var(--yellow);background:var(--yellow)}.issue-copy{min-width:0}.issue-title{font-size:12px;color:#dedee0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.issue-sub{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;color:#77787e;margin:2px 0 0 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.machine-label{color:#c3c3ff;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap}.pill{display:inline-flex;align-items:center;gap:5px;width:max-content;max-width:100%;border:1px solid #343539;border-radius:4px;color:#b9b9bd;padding:2px 6px;font-size:10px;white-space:nowrap}.pill:before{content:"";width:5px;height:5px;border-radius:50%;background:#888}.pill.pending{color:#c2c2c7}.pill.sent{color:#9dc7e8;border-color:#314354}.pill.sent:before{background:#79b6e7}.pill.verify{color:#e0c477;border-color:#514525}.pill.verify:before{background:var(--yellow)}.pill.closed{color:#8fcaa0;border-color:#2e4b37}.pill.closed:before{background:var(--green)}.row-date{color:#929398;font-size:11px;white-space:nowrap}.empty{padding:28px;text-align:center;color:var(--muted);border-bottom:1px solid var(--line)}
    .detail-backdrop{position:fixed;inset:0;background:#0008;z-index:5;display:none}.detail{position:fixed;z-index:6;right:0;top:0;bottom:0;width:min(430px,94vw);background:#151618;border-left:1px solid #333438;box-shadow:-12px 0 40px #0005;transform:translateX(102%);transition:transform .18s ease;overflow:auto}.detail.open{transform:translateX(0)}.detail-backdrop.open{display:block}.detail-head{position:sticky;top:0;background:#151618ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:13px 17px;display:flex;justify-content:space-between;align-items:center;z-index:1}.detail-head-label{font-size:11px;color:var(--muted)}.icon-button,.button{border:1px solid var(--line);background:transparent;color:#b9b9bd;border-radius:5px;padding:6px 9px}.icon-button:hover,.button:hover{background:var(--raised);color:white}.button.primary{background:#353569;border-color:#45457b;color:#e5e5ff}.button.danger{color:#ffaaaa;border-color:#603838}.detail-content{padding:20px 20px 36px}.detail-id{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:#8a8b91;margin-bottom:8px}.detail-title{font-size:18px;line-height:1.35;margin:0 0 12px;overflow-wrap:anywhere}.detail-statuses{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.detail-section{border-top:1px solid var(--line);padding:15px 0}.detail-section h3{font-size:10px;font-weight:600;color:#85868c;letter-spacing:.07em;text-transform:uppercase;margin:0 0 11px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px 10px}.detail-field label{display:block;font-size:10px;color:#77787e;margin-bottom:3px}.detail-field div{font-size:12px;color:#d2d2d4;overflow-wrap:anywhere}.detail-text{font-size:12px;color:#c5c5c8;white-space:pre-wrap;overflow-wrap:anywhere}.control-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0}.control-row label{font-size:11px;color:#aaaab0}.status-select{background:#1b1c1e;border:1px solid var(--line);border-radius:5px;padding:6px 8px;min-width:145px}.checkbox-line{display:flex;align-items:center;gap:8px;color:#d0d0d3;font-size:12px}.checkbox-line input{accent-color:var(--accent);width:15px;height:15px}.raw-order{color:var(--muted);font-size:11px;margin-top:8px;overflow-wrap:anywhere}.attachment-box{border:1px solid var(--line);border-radius:6px;background:#111214;padding:11px}.attachment-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.file-name{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere;color:#c7c7ff}.file-meta{color:var(--muted);font-size:10px;margin:4px 0 9px}.file-preview{max-height:220px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px solid var(--line);padding-top:9px;margin:10px 0 0;color:#c0c1c5;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}.file-hint{font-size:10px;color:var(--muted);margin-top:8px}.error-text{color:#ff9999;font-size:11px;margin-top:8px}.mobile-nav{display:none}[hidden]{display:none!important}
    @media(max-width:800px){.app{grid-template-columns:178px minmax(0,1fr)}.sidebar{padding-left:8px;padding-right:8px}.content{padding:23px 15px 45px}.list-heading,.issue-row{grid-template-columns:minmax(180px,1.7fr) minmax(110px,.9fr) minmax(95px,.8fr)}.list-heading>*:nth-child(3),.issue-row>*:nth-child(3){display:none}}
    @media(max-width:600px){.app{display:block}.sidebar{display:none}.mobile-nav{display:flex;gap:4px;overflow:auto;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--side)}.mobile-nav .nav-item{width:auto;white-space:nowrap;padding:6px 9px}.mobile-nav .count{margin-left:2px}.content{padding:19px 12px 40px}.page-title{font-size:18px}.page-title-row{margin-bottom:15px}.list-toolbar{flex-wrap:wrap}.search-wrap{max-width:none;flex-basis:100%}.list-count{margin-left:0}.list-heading{display:none}.issue-row{grid-template-columns:minmax(0,1fr) auto;gap:5px 8px;padding:10px 9px}.issue-row>*:nth-child(2){grid-column:1;grid-row:2;padding-left:18px}.issue-row>*:nth-child(3){display:block;grid-column:2;grid-row:1;justify-self:end}.issue-row>*:nth-child(4){grid-column:2;grid-row:2;justify-self:end;font-size:10px}.issue-main{grid-column:1;grid-row:1}.detail{width:min(430px,100vw)}.detail.open{transform:translateX(0)}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar"><div class="brand"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M5 11 4 3l8 5a13 13 0 0 1 8 0l8-5-1 8c1 7-2 11-7 13 3 1 5 3 6 6H6c1-3 3-5 6-6-5-2-8-6-7-13Z"/></svg></div><div><div class="brand-title">備品管理</div></div></div><div><div class="nav-label">送修項目</div><nav class="nav" id="side-nav" aria-label="送修狀態"></nav></div></aside>
    <main class="main">
      <section class="content"><div id="notice" class="notice" role="status" hidden></div><div class="page-title-row"><div><h1 class="page-title">送修紀錄</h1><div class="page-subtitle">追蹤送修狀態、是否開單、設備與 Fail Log</div></div><span id="demo-tag" class="public-tag" hidden>示例資料</span></div>
        <div class="list-toolbar"><div class="search-wrap"><span class="search-icon">⌕</span><input id="search" class="search" type="search" placeholder="搜尋料號、序號、設備或故障內容…" aria-label="搜尋送修紀錄"></div><select id="order-filter" class="order-select" aria-label="依原始開單狀態篩選"><option value="">所有開單狀態</option></select><span id="list-count" class="list-count">—</span></div>
        <div class="list-heading"><span>項目</span><span>目前狀態</span><span>機台</span><span>日期</span></div><div id="issue-list" class="rows" aria-label="送修清單"></div>
      </section>
    </main>
  </div>
  <nav class="mobile-nav" id="mobile-nav" aria-label="送修狀態"></nav><div id="detail-backdrop" class="detail-backdrop"></div>
  <aside id="detail" class="detail" aria-label="送修詳細資料" aria-hidden="true"><div class="detail-head"><span class="detail-head-label">送修詳細資料</span><button id="close-detail" class="icon-button" type="button" aria-label="關閉詳細資料">✕</button></div><div id="detail-content" class="detail-content"></div></aside>
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    const supabase=createClient("https://ywazcutaodqrthhighod.supabase.co","sb_publishable_wu8mVnxG-ifzSDB8Zl4wlg_xCRjl9k3");
    const BUCKET="repair-fail-logs",MAX_FILE_SIZE=5*1024*1024;
    const STATUSES=["待送修","已送修","取回驗證","已結案"];
    const demoRecords=[
      {id:"demo-1",current_status:"取回驗證",order_status:"已開單",is_opened:true,repair_month:"202606",item:"示例 A",area:"CP",machine_code:"F20",model:"T5377S",tester_id:"TERA76",board_part_code:"DEMO-030001",serial_no:"DEMO-SN-001",description:"I/O PE（示例）",failure_data:"示例故障資料，非實際紀錄",occurred_on:"2026-06-12",sent_on:"2026-06-15",returned_on:null},
      {id:"demo-2",current_status:"已送修",order_status:"已開單",is_opened:true,repair_month:"202606",item:"示例 B",area:"CP",machine_code:"F47",model:"T5377S",tester_id:"TERA8",board_part_code:"DEMO-030002",serial_no:"DEMO-SN-002",description:"DC BOARD（示例）",failure_data:"示例測試失敗訊息",occurred_on:"2026-06-09",sent_on:"2026-06-10",returned_on:null},
      {id:"demo-3",current_status:"已結案",order_status:"已開單",is_opened:true,repair_month:"202606",item:"示例 C",area:"CP",machine_code:"F49",model:"T5377S",tester_id:"PSC118",board_part_code:"DEMO-030003",serial_no:"DEMO-SN-003",description:"FM CONT（示例）",failure_data:"示例維修完成",occurred_on:"2026-06-05",sent_on:"2026-06-06",returned_on:"2026-06-11"}
    ];
    const views=[{id:"待送修",label:"待送修",icon:"○"},{id:"已送修",label:"已送修",icon:"↗"},{id:"取回驗證",label:"取回驗證",icon:"◉"},{id:"已結案",label:"已結案",icon:"✓"}];
    let records=demoRecords,selectedId="demo-1",activeView="全部",showDetail=window.matchMedia("(min-width: 601px)").matches,attachmentRequest=0;
    const byId=id=>document.getElementById(id),notice=byId("notice");
    function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
    function dateText(v){if(!v)return "—";const d=new Date(`${v}T00:00:00`);return Number.isNaN(d.valueOf())?v:new Intl.DateTimeFormat("zh-TW",{month:"short",day:"numeric"}).format(d);}
    function machineLabel(r){return r.tester_id?`${r.machine_code||"—"}-${r.tester_id}`:(r.machine_code||"—");}
    function tone(status){return status==="已結案"?"closed":status==="取回驗證"?"verify":status==="已送修"?"sent":"pending";}
    function shownRecords(){return activeView==="全部"?records:records.filter(r=>r.current_status===activeView);}
    function renderNav(){const nav=views.map(v=>`<button class="nav-item" type="button" data-view="${v.id}" aria-current="${activeView===v.id?"page":"false"}"><span class="nav-icon">${v.icon}</span><span class="nav-name">${v.label}</span><span class="count">${records.filter(r=>r.current_status===v.id).length}</span></button>`).join("");const all=`<button class="nav-item" type="button" data-view="全部" aria-current="${activeView==="全部"?"page":"false"}"><span class="nav-icon">▤</span><span class="nav-name">全部送修</span><span class="count">${records.length}</span></button>`;byId("side-nav").innerHTML=all+nav;byId("mobile-nav").innerHTML=all+nav;document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>{activeView=b.dataset.view;render();}));}
    function renderDetail(r,open=showDetail){const panel=byId("detail"),body=byId("detail-content");if(!r){body.replaceChildren();panel.classList.remove("open");byId("detail-backdrop").classList.remove("open");panel.setAttribute("aria-hidden","true");return;}
      const demo=String(r.id).startsWith("demo-");body.innerHTML=`<div class="detail-id">${esc(r.repair_month||"送修紀錄")} · ${esc(r.item||"")}</div><h2 class="detail-title">${esc(r.description||"未填寫 Description")}</h2>
        <div class="detail-statuses"><span class="pill ${tone(r.current_status)}">${esc(r.current_status||"待送修")}</span><span class="pill">開單：${r.is_opened?"是":"否"}</span></div>
        <section class="detail-section"><h3>處理狀態</h3><div class="control-row"><label for="status-select">目前狀態</label><select id="status-select" class="status-select" ${demo?"disabled":""}>${STATUSES.map(s=>`<option value="${s}" ${r.current_status===s?"selected":""}>${s}</option>`).join("")}</select></div><label class="checkbox-line"><input id="is-opened" type="checkbox" ${r.is_opened?"checked":""} ${demo?"disabled":""}> 是否開單</label><div class="raw-order">原始開單狀態：${esc(r.order_status||"（空白）")}</div><div id="record-message" class="file-hint">${demo?"示例資料不可修改。":"變更會立即公開儲存。"}</div></section>
        <section class="detail-section"><h3>設備資訊</h3><div class="detail-grid"><div class="detail-field"><label>Machine / TesterID</label><div>${esc(machineLabel(r))}</div></div><div class="detail-field"><label>Model</label><div>${esc(r.model||"—")}</div></div><div class="detail-field"><label>Area</label><div>${esc(r.area||"—")}</div></div><div class="detail-field"><label>Item</label><div>${esc(r.item||"—")}</div></div><div class="detail-field"><label>Board Part Code</label><div>${esc(r.board_part_code||"—")}</div></div><div class="detail-field"><label>Serial NO</label><div>${esc(r.serial_no||"—")}</div></div></div></section>
        <section class="detail-section"><h3>送修時程</h3><div class="detail-grid"><div class="detail-field"><label>發生日期</label><div>${esc(dateText(r.occurred_on))}</div></div><div class="detail-field"><label>送修日期</label><div>${esc(dateText(r.sent_on))}</div></div><div class="detail-field"><label>回修日期</label><div>${esc(dateText(r.returned_on))}</div></div></div></section>
        <section class="detail-section"><h3>Failure Data</h3><div class="detail-text">${esc(r.failure_data||"尚無故障資料")}</div></section>
        <section class="detail-section"><h3>Fail Log 附件</h3><div id="attachment-box" class="attachment-box"><div class="file-hint">載入附件中…</div></div></section>`;
      panel.classList.toggle("open",open);byId("detail-backdrop").classList.toggle("open",open);panel.setAttribute("aria-hidden",String(!open));
      if(!demo){byId("status-select").addEventListener("change",e=>updateRecord(r,{current_status:e.target.value}));byId("is-opened").addEventListener("change",e=>updateRecord(r,{is_opened:e.target.checked}));}
      loadAttachment(r,demo);
    }
    function fillOrderFilter(){const s=byId("order-filter"),v=s.value;s.replaceChildren(new Option("所有開單狀態",""));[...new Set(records.map(r=>r.order_status).filter(Boolean))].sort().forEach(x=>s.add(new Option(x,x)));if([...s.options].some(o=>o.value===v))s.value=v;}
    function render(){const q=byId("search").value.trim().toLocaleLowerCase(),order=byId("order-filter").value;const filtered=shownRecords().filter(r=>[r.machine_code,r.tester_id,machineLabel(r),r.board_part_code,r.serial_no,r.description,r.failure_data,r.area,r.item].join(" ").toLocaleLowerCase().includes(q)&&(!order||r.order_status===order));byId("list-count").textContent=`${filtered.length} 筆`;byId("issue-list").innerHTML=filtered.length?filtered.map(r=>`<button class="issue-row ${r.id===selectedId?"selected":""}" type="button" data-id="${esc(r.id)}"><span class="issue-main"><span class="state-dot ${tone(r.current_status)}"></span><span class="issue-copy"><span class="issue-title">${esc(r.description||"未填寫 Description")}</span><span class="issue-sub">${esc(r.board_part_code||"無料號")} · S/N ${esc(r.serial_no||"—")}${r.is_opened?" · ✓ 已開單":""}</span></span></span><span><span class="pill ${tone(r.current_status)}">${esc(r.current_status||"待送修")}</span></span><span class="machine-label">${esc(machineLabel(r))}</span><span class="row-date">${esc(dateText(r.sent_on||r.occurred_on))}</span></button>`).join(""):'<div class="empty">沒有符合條件的送修紀錄</div>';renderNav();const selected=filtered.find(r=>r.id===selectedId)||filtered[0]||null;if(selected){selectedId=selected.id;renderDetail(selected,showDetail);}else renderDetail(null);}
    function setNotice(text,kind=""){notice.className=`notice ${kind}`.trim();notice.textContent=text;notice.hidden=false;}
    function showPreview(message,error=false){records=demoRecords;selectedId=demoRecords[0].id;byId("demo-tag").hidden=false;setNotice(message,error?"error":"");fillOrderFilter();render();}
    async function loadRecords(){const {data,error}=await supabase.from("repair_records").select("id,current_status,order_status,is_opened,repair_month,item,area,machine_code,model,tester_id,board_part_code,serial_no,description,failure_data,occurred_on,sent_on,returned_on,updated_at").order("occurred_on",{ascending:false,nullsFirst:false});if(error){showPreview(`Supabase 尚未就緒或讀取失敗：${error.message}。請先執行 supabase/repairs_setup.sql。`,true);return;}records=(data||[]).map(r=>({...r,is_opened:!!r.is_opened}));selectedId=records[0]?.id||null;byId("demo-tag").hidden=true;notice.hidden=true;fillOrderFilter();render();}
    async function updateRecord(record,changes){const msg=byId("record-message");msg.textContent="正在儲存…";const {data,error}=await supabase.from("repair_records").update(changes).eq("id",record.id).select("id").single();if(error){msg.textContent=`儲存失敗：${error.message}`;return;}Object.assign(record,changes);msg.textContent="已儲存（公開資料）";render();}
    async function loadAttachment(record,demo){const box=byId("attachment-box"),request=++attachmentRequest;if(!box)return;if(demo){box.innerHTML='<div class="file-hint">此示例紀錄尚無附件。正式資料載入後可上傳 TXT／ASC（最多 5 MB）。</div><button class="button" type="button" id="upload-file" disabled>上傳 Fail Log</button>';return;}box.innerHTML='<div class="file-hint">載入附件中…</div>';const {data,error}=await supabase.from("repair_attachments").select("id,repair_record_id,storage_path,filename,file_size,content_type,created_at").eq("repair_record_id",record.id).maybeSingle();if(request!==attachmentRequest||!byId("attachment-box"))return;if(error){box.innerHTML=`<div class="error-text">附件讀取失敗：${esc(error.message)}</div>`;return;}if(!data){box.innerHTML='<div class="file-hint">尚未上傳 Fail Log</div><input id="file-input" type="file" accept=".txt,.asc,text/plain" hidden><button class="button primary" type="button" id="upload-file">＋ 上傳 Fail Log</button><div class="file-hint">僅接受 .txt／.asc，最大 5 MB；每筆送修限一個檔案。</div>';byId("upload-file").addEventListener("click",()=>byId("file-input").click());byId("file-input").addEventListener("change",e=>{if(e.target.files?.[0])uploadAttachment(record,e.target.files[0]);});return;}
      const size=(data.file_size/1024).toFixed(data.file_size<10240?1:0);box.innerHTML=`<div class="file-name">${esc(data.filename)}</div><div class="file-meta">${size} KB · ${esc(new Date(data.created_at).toLocaleString("zh-TW"))}</div><div class="attachment-actions"><button class="button" id="view-file" type="button">檢視文字</button><a class="button" href="${esc(supabase.storage.from(BUCKET).getPublicUrl(data.storage_path).data.publicUrl)}" target="_blank" rel="noopener">下載</a><button class="button danger" id="delete-file" type="button">刪除附件</button></div><pre id="file-preview" class="file-preview" hidden></pre><div id="file-message" class="file-hint"></div>`;
      byId("view-file").addEventListener("click",async()=>{const p=byId("file-preview"),m=byId("file-message");p.hidden=false;p.textContent="載入中…";const {data:blob,error:downloadError}=await supabase.storage.from(BUCKET).download(data.storage_path);if(downloadError){p.textContent="";m.textContent=`檔案讀取失敗：${downloadError.message}`;return;}p.textContent=await blob.text();});
      byId("delete-file").addEventListener("click",()=>deleteAttachment(data));
    }
    async function uploadAttachment(record,file){const message=byId("attachment-box");const ext=file.name.split(".").pop().toLowerCase();if(!["txt","asc"].includes(ext)){message.insertAdjacentHTML("beforeend",'<div class="error-text">格式不符，只能上傳 .txt 或 .asc。</div>');return;}if(file.size===0||file.size>MAX_FILE_SIZE){message.insertAdjacentHTML("beforeend",'<div class="error-text">檔案需大於 0 且不可超過 5 MB。</div>');return;}const path=`${record.id}/${crypto.randomUUID()}.${ext}`;message.innerHTML='<div class="file-hint">正在上傳…</div>';const {error:uploadError}=await supabase.storage.from(BUCKET).upload(path,file,{contentType:"text/plain",upsert:false});if(uploadError){message.innerHTML=`<div class="error-text">上傳失敗：${esc(uploadError.message)}</div>`;return;}const {error:metaError}=await supabase.from("repair_attachments").insert({repair_record_id:record.id,storage_path:path,filename:file.name,file_size:file.size,content_type:"text/plain"});if(metaError){await supabase.storage.from(BUCKET).remove([path]);message.innerHTML=`<div class="error-text">附件資料寫入失敗：${esc(metaError.message)}</div>`;return;}await loadAttachment(record,false);}
    async function deleteAttachment(attachment){if(!window.confirm(`即將永久刪除 Fail Log：\n\n${attachment.filename}\n\n刪除後無法復原。確定要刪除嗎？`))return;const msg=byId("file-message");byId("delete-file").disabled=true;msg.textContent="正在刪除…";const {error:storageError}=await supabase.storage.from(BUCKET).remove([attachment.storage_path]);if(storageError){msg.textContent=`刪除失敗：${storageError.message}`;byId("delete-file").disabled=false;return;}const {error:rowError}=await supabase.from("repair_attachments").delete().eq("id",attachment.id);if(rowError){msg.textContent=`檔案已刪除，但附件索引更新失敗：${rowError.message}`;return;}const row=records.find(r=>r.id===attachment.repair_record_id);if(row)await loadAttachment(row,false);}
    byId("search").addEventListener("input",render);byId("order-filter").addEventListener("change",render);byId("issue-list").addEventListener("click",e=>{const row=e.target.closest("[data-id]");if(!row)return;selectedId=row.dataset.id;showDetail=true;render();});byId("close-detail").addEventListener("click",()=>{showDetail=false;renderDetail(null);});byId("detail-backdrop").addEventListener("click",()=>{showDetail=false;renderDetail(null);});
    byId("demo-tag").hidden=false;render();loadRecords();
  </script>
</body>
</html>
