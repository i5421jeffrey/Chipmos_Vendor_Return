    async function createDbnRecord(event){event.preventDefault();const form=byId("dbn-form"),button=byId("submit-dbn"),message=byId("dbn-message"),serialInput=byId("dbn-serial");serialInput.value=normalizeSerial(serialInput.value);if(!form.reportValidity())return;const machine=machines.find(m=>m.machine_code===byId("dbn-machine").value),board=modelBoards.find(b=>b.model===machine?.model&&b.board_name===byId("dbn-board").value);if(!machine||!board){message.textContent="請選擇有效的機台與該 Model 對應的板件名稱。";return;}const customer=byId("dbn-customer").value,product=byId("dbn-product").value,station=byId("dbn-station").value,customerHasProducts=dbnCombinations.some(x=>x.customer_code===customer);if(customerHasProducts&&!dbnCombinations.some(x=>x.customer_code===customer&&x.product_code===product&&x.station_code===station)){message.textContent="請依序選擇有效的客戶、產品與站點組合。";return;}if(!customerHasProducts&&(product||station)){message.textContent="此客戶目前沒有產品／站點，請保留空白。";return;}button.disabled=true;message.textContent="正在新增 DBN 紀錄…";const payload={serial_no:serialInput.value,machine_code:machine.machine_code,model:machine.model,board_name:board.board_name,board_part_code:board.board_part_code,customer_code:customer,product_code:product||null,station_code:station||null};const {error}=await supabase.from("dbn_records").insert(payload);button.disabled=false;if(error){message.textContent=`新增失敗：${error.message}`;return;}closeDbnModal();await loadDbnData();activeView="DBN";byId("search").value="";render();setNotice("DBN 紀錄已新增；未建立送修案件。"," ");}
    async function saveRecordEdits(event,record){event.preventDefault();const form=byId("edit-record-form"),button=byId("finish-edit"),message=byId("edit-message"),serial=byId("edit-serial_no"),failureDescription=byId("edit-failure-description");if(!failureSchemaReady){message.textContent="異常標籤欄位尚未啟用";return;}serial.value=normalizeSerial(serial.value);failureDescription.value=failureDescription.value.trim();failureDescription.required=false;if(!form.reportValidity())return;const fd=new FormData(form),text=name=>String(fd.get(name)||"").trim(),date=name=>text(name)||null,payload={is_opened:fd.get("is_opened")==="on",repair_month:text("repair_month"),item:text("item"),area:text("area"),machine_code:text("machine_code"),model:text("model"),board_part_code:text("board_part_code"),serial_no:text("serial_no"),description:text("description"),failure_tag:text("failure_tag"),failure_description:text("failure_description"),occurred_on:date("occurred_on"),sent_on:date("sent_on"),returned_on:date("returned_on")};if(ACTIVE_STATUSES.includes(record.current_status))payload.current_status=text("current_status");if(!FAILURE_TAGS.includes(payload.failure_tag)){message.textContent="請選擇有效的異常標籤。";return;}if(!machines.some(m=>m.machine_code===payload.machine_code)||!modelBoards.some(b=>b.model===payload.model&&b.board_name===payload.description&&b.board_part_code===payload.board_part_code)){message.textContent="請選擇有效的機台、板件名稱與 Part Number 組合。";return;}const {data:attachment,error:attachmentError}=await supabase.from("repair_attachments").select("id").eq("repair_record_id",record.id).maybeSingle();if(attachmentError){message.textContent=`確認 Fail Log 狀態失敗：${attachmentError.message}`;return;}if(!attachment&&!payload.failure_description){failureDescription.required=true;failureDescription.reportValidity();message.textContent="此案件沒有 Fail Log，請填寫異常描述。";return;}failureDescription.required=false;button.disabled=true;message.textContent="正在儲存並同步此 S/N 的板件對應…";const {error}=await supabase.rpc("save_repair_record_edit_with_failure_info",{p_record_id:record.id,p_payload:payload});button.disabled=false;if(error){message.textContent=`儲存失敗：${error.message}`;return;}const previousSerial=record.serial_no;records=records.map(r=>{if(r.id===record.id)return {...r,...payload};if(r.serial_no===payload.serial_no){const part=modelBoards.find(b=>b.model===r.model&&b.board_name===payload.description)?.board_part_code||payload.board_part_code;return {...r,description:payload.description,board_part_code:part};}return r;});if(previousSerial!==payload.serial_no)records=records.map(r=>r.id===record.id?{...r,...payload}:r);editingRecordId=null;await loadDbnData();render();}
    async function deleteRecord(record){const message=byId("edit-message"),button=byId("delete-record");if(!window.confirm(`即將永久刪除此筆送修資料：\n\n${record.description||"送修紀錄"} · S/N ${record.serial_no||"—"}\n\n相關 Fail Log 也會一併移除。此操作無法復原，確定刪除？`))return;button.disabled=true;byId("cancel-edit").disabled=true;byId("finish-edit").disabled=true;message.textContent="正在刪除資料…";const {data:attachment,error:attachmentError}=await supabase.from("repair_attachments").select("storage_path").eq("repair_record_id",record.id).maybeSingle();if(attachmentError){button.disabled=false;byId("cancel-edit").disabled=false;byId("finish-edit").disabled=false;message.textContent=`讀取 Fail Log 資訊失敗，資料未刪除：${attachmentError.message}`;return;}const {data:deleted,error}=await supabase.from("repair_records").delete().eq("id",record.id).select("id").maybeSingle();if(error||!deleted){button.disabled=false;byId("cancel-edit").disabled=false;byId("finish-edit").disabled=false;message.textContent=error?`刪除失敗：${error.message}`:"找不到此筆資料，可能已被刪除；請重新整理。";return;}let cleanupError="";if(attachment?.storage_path){const {error:storageError}=await supabase.storage.from(BUCKET).remove([attachment.storage_path]);if(storageError)cleanupError=storageError.message;}records=records.filter(item=>item.id!==record.id);selectedId=records[0]?.id||null;editingRecordId=null;showDetail=records.length>0;render();setNotice(cleanupError?`送修資料已刪除，但 Fail Log 檔案清理失敗：${cleanupError}`:"送修資料與相關 Fail Log 已刪除。",cleanupError?"error":"");}
    async function copyFailLog(fromId,toId){const {data:attachment,error}=await supabase.from("repair_attachments").select("storage_path,filename,file_size,content_type").eq("repair_record_id",fromId).maybeSingle();if(error)return `讀取原 Fail Log 失敗：${error.message}`;if(!attachment)return "";const {data:blob,error:downloadError}=await supabase.storage.from(BUCKET).download(attachment.storage_path);if(downloadError)return `下載原 Fail Log 失敗：${downloadError.message}`;const ext=attachment.filename.split(".").pop().toLowerCase(),path=`${toId}/${crypto.randomUUID()}.${ext}`;const {error:uploadError}=await supabase.storage.from(BUCKET).upload(path,blob,{contentType:attachment.content_type||"text/plain",upsert:false});if(uploadError)return `複製 Fail Log 失敗：${uploadError.message}`;const {error:metaError}=await supabase.from("repair_attachments").insert({repair_record_id:toId,storage_path:path,filename:attachment.filename,file_size:attachment.file_size,content_type:attachment.content_type||"text/plain"});if(metaError){await supabase.storage.from(BUCKET).remove([path]);return `Fail Log 檔案複製成功但索引寫入失敗：${metaError.message}`;}return "";}
    async function finishVerification(record,passed){if(!passed&&!window.confirm(`將此案件結案為 FAIL，並建立同 S/N 的新待送修案件。\n\nFail Log 會複製到新案件，原案件保留不變。\n\n確定繼續？`))return;const buttons=[byId("resolve-pass"),byId("resolve-fail")].filter(Boolean);buttons.forEach(b=>b.disabled=true);const {data,error}=await supabase.rpc("finish_repair_verification",{p_record_id:record.id,p_passed:passed});if(error){buttons.forEach(b=>b.disabled=false);setNotice(`驗證結果儲存失敗：${error.message}`,"error");return;}const today=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());record.current_status=passed?CLOSED_PASS:CLOSED_FAIL;record.closed_on=today;if(passed){setNotice("已記錄 PASS，案件已結案。");render();return;}const newId=String(data||"").replace(/^"|"$/g,"");if(!newId){setNotice("原案件已結案 FAIL，但資料庫未回傳新案件編號；請重新載入並確認 Supabase 歷程資料。");await loadRecords();return;}const copyError=await copyFailLog(record.id,newId);const columns="id,current_status,order_status,is_opened,repair_month,item,area,machine_code,model,tester_id,board_part_code,serial_no,description,occurred_on,sent_on,returned_on,closed_on,retry_of_record_id,failure_tag,failure_description,created_at,updated_at";const {data:newRecord,error:readError}=await supabase.from("repair_records").select(columns).eq("id",newId).single();if(readError){setNotice(`再次送修案件已建立，但讀取新案件失敗：${readError.message}`);await loadRecords();return;}records.unshift({...newRecord,is_opened:!!newRecord.is_opened});selectedId=newId;activeView="待送修";showDetail=true;editingRecordId=null;setNotice(copyError?`已建立再次送修案件，但附件複製未完成：${copyError}`:"已結案 FAIL，並建立已帶入資料與 Fail Log 的新待送修案件。",copyError?"error":"");render();}
    function openHistoryRecord(id){const record=records.find(r=>r.id===id);if(!record)return;selectedId=id;if(activeView!=="全部"&&activeView!==record.current_status)activeView=record.current_status;showDetail=true;editingRecordId=null;render();}
    function closeCreateModal(){byId("create-modal").hidden=true;}
    function normalizeSerial(value){const serial=String(value||"").trim();return /^\d{1,9}$/.test(serial)?serial.padStart(9,"0"):serial.toUpperCase();}
    async function createRecord(event){event.preventDefault();const form=byId("create-form"),button=byId("submit-create"),message=byId("create-message"),serialInput=byId("new-serial"),file=byId("new-file-input").files?.[0];if(!failureSchemaReady){message.textContent="異常標籤欄位尚未啟用";return;}serialInput.value=normalizeSerial(serialInput.value);if(file&&!validFailLog(file)){message.textContent="Fail Log 格式或大小不符；僅接受非空的 .txt／.asc 檔案，最大 5 MB。";return;}updateNewFailureDescriptionRequirement();if(!form.reportValidity())return;const fd=new FormData(form),value=name=>String(fd.get(name)||"").trim(),failureTag=value("failure_tag");if(!FAILURE_TAGS.includes(failureTag)){message.textContent="請選擇異常標籤。";return;}button.disabled=true;byId("new-file-button").disabled=true;message.textContent=file?"正在上傳 Fail Log 並新增送修…":"正在新增送修…";const recordId=crypto.randomUUID(),payload={current_status:"待送修",order_status:"",is_opened:false,repair_month:"",item:"",area:"",machine_code:value("machine_code"),model:value("model"),board_part_code:value("board_part_code"),serial_no:value("serial_no"),description:value("description"),failure_tag:failureTag,failure_description:value("failure_description"),occurred_on:value("occurred_on"),sent_on:null,returned_on:null,source_system:"web",source_record_id:null};let attachmentPayload=null,storagePath="";if(file){const ext=file.name.split(".").pop().toLowerCase();storagePath=`${recordId}/${crypto.randomUUID()}.${ext}`;const {error:uploadError}=await supabase.storage.from(BUCKET).upload(storagePath,file,{contentType:"text/plain",upsert:false});if(uploadError){button.disabled=false;byId("new-file-button").disabled=false;message.textContent=`Fail Log 上傳失敗，未建立送修資料：${uploadError.message}`;return;}attachmentPayload={storage_path:storagePath,filename:file.name,file_size:file.size,content_type:"text/plain"};}const {data,error}=await supabase.rpc("create_repair_record_with_failure_info",{p_record_id:recordId,p_payload:payload,p_attachment:attachmentPayload}).single();if(error||!data){if(storagePath)await supabase.storage.from(BUCKET).remove([storagePath]);button.disabled=false;byId("new-file-button").disabled=false;message.textContent=`新增失敗：${error?.message||"資料庫未回傳新紀錄"}`;return;}records.unshift({...data,is_opened:!!data.is_opened});selectedId=data.id;activeView="全部";showDetail=true;form.reset();byId("new-file-name").textContent="尚未選擇檔案";updateNewFailureDescriptionRequirement();closeCreateModal();render();}
    async function loadAttachment(record,demo){const box=byId("attachment-box"),request=++attachmentRequest;if(!box)return;if(demo){box.innerHTML='<div class="upload-empty-state"><div class="upload-empty-copy"><span class="upload-symbol" aria-hidden="true">↑</span><div><div class="upload-empty-title">示例紀錄尚無附件</div><div class="upload-empty-hint">此為示範畫面，無法上傳檔案。</div></div></div><button class="button primary upload-trigger" type="button" id="upload-file" disabled><span class="upload-trigger-icon" aria-hidden="true">↑</span><span>選擇 Fail Log</span></button></div>';return;}box.innerHTML='<div class="file-hint">載入附件中…</div>';const {data,error}=await supabase.from("repair_attachments").select("id,repair_record_id,storage_path,filename,file_size,content_type,created_at").eq("repair_record_id",record.id).maybeSingle();if(request!==attachmentRequest||!byId("attachment-box"))return;if(error){box.innerHTML=`<div class="error-text">附件讀取失敗：${esc(error.message)}</div>`;return;}if(!data){box.innerHTML='<div class="upload-empty-state"><input id="file-input" type="file" accept=".txt,.asc,text/plain" hidden><div class="upload-empty-copy"><span class="upload-symbol" aria-hidden="true">↑</span><div><div class="upload-empty-title">尚未上傳 Fail Log</div><div class="upload-empty-hint">支援 .txt／.asc，最大 5 MB；每筆送修限一個檔案。</div></div></div><button class="button primary upload-trigger" type="button" id="upload-file"><span class="upload-trigger-icon" aria-hidden="true">↑</span><span>選擇 Fail Log</span></button></div>';byId("upload-file").addEventListener("click",()=>byId("file-input").click());byId("file-input").addEventListener("change",e=>{if(e.target.files?.[0])uploadAttachment(record,e.target.files[0]);});return;}
      const size=(data.file_size/1024).toFixed(data.file_size<10240?1:0);box.innerHTML=`<div class="file-name">${esc(data.filename)}</div><div class="file-meta">${size} KB · ${esc(new Date(data.created_at).toLocaleString("zh-TW"))}</div><div class="attachment-actions"><button class="button" id="view-file" type="button">檢視文字</button><a class="button" href="${esc(supabase.storage.from(BUCKET).getPublicUrl(data.storage_path).data.publicUrl)}" target="_blank" rel="noopener">下載</a><button class="button danger" id="delete-file" type="button">刪除附件</button></div><pre id="file-preview" class="file-preview" hidden></pre><div id="file-message" class="file-hint"></div>`;
      byId("view-file").addEventListener("click",async()=>{const p=byId("file-preview"),m=byId("file-message");p.hidden=false;p.textContent="載入中…";const {data:blob,error:downloadError}=await supabase.storage.from(BUCKET).download(data.storage_path);if(downloadError){p.textContent="";m.textContent=`檔案讀取失敗：${downloadError.message}`;return;}p.textContent=await blob.text();});
      byId("delete-file").addEventListener("click",()=>deleteAttachment(data));

    function validFailLog(file){const ext=file.name.split(".").pop().toLowerCase();return ["txt","asc"].includes(ext)&&file.size>0&&file.size<=MAX_FILE_SIZE;}
    async function storeAttachment(record,file){const ext=file.name.split(".").pop().toLowerCase(),path=`${record.id}/${crypto.randomUUID()}.${ext}`;const {error:uploadError}=await supabase.storage.from(BUCKET).upload(path,file,{contentType:"text/plain",upsert:false});if(uploadError)return uploadError.message;const {error:metaError}=await supabase.from("repair_attachments").insert({repair_record_id:record.id,storage_path:path,filename:file.name,file_size:file.size,content_type:"text/plain"});if(metaError){await supabase.storage.from(BUCKET).remove([path]);return metaError.message;}return "";}

    async function deleteAttachment(attachment){const record=records.find(r=>r.id===attachment.repair_record_id),msg=byId("file-message");if(record&&!String(record.failure_description||"").trim()){msg.textContent="此筆沒有異常描述；請先編輯補上描述，再刪除 Fail Log。";return;}if(!window.confirm(`即將永久刪除 Fail Log：\n\n${attachment.filename}\n\n刪除後無法復原。確定要刪除嗎？`))return;byId("delete-file").disabled=true;msg.textContent="正在刪除…";const {error:storageError}=await supabase.storage.from(BUCKET).remove([attachment.storage_path]);if(storageError){msg.textContent=`刪除失敗：${storageError.message}`;byId("delete-file").disabled=false;return;}const {error:rowError}=await supabase.from("repair_attachments").delete().eq("id",attachment.id);if(rowError){msg.textContent=`檔案已刪除，但附件索引更新失敗：${rowError.message}`;return;}if(record)await loadAttachment(record,false);}
    byId("search").addEventListener("input",render);byId("failure-tag-filter").addEventListener("change",render);byId("issue-list").addEventListener("click",e=>{const dbnAction=e.target.closest("[data-dbn-action]");if(dbnAction){const id=dbnAction.dataset.id;if(dbnAction.dataset.dbnAction==="edit"){dbnEditingId=id;render();}else if(dbnAction.dataset.dbnAction==="cancel"){dbnEditingId=null;render();}else if(dbnAction.dataset.dbnAction==="delete"){deleteDbnRecord(id,dbnAction);}return;}const dbnLink=e.target.closest("[data-dbn-serial]");if(dbnLink){e.preventDefault();e.stopPropagation();openDbnForSerial(dbnLink.dataset.dbnSerial);return;}const row=e.target.closest("[data-id]");if(!row)return;selectedId=row.dataset.id;showDetail=true;render();});byId("issue-list").addEventListener("keydown",e=>{const dbnLink=e.target.closest("[data-dbn-serial]");if(dbnLink&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.stopPropagation();openDbnForSerial(dbnLink.dataset.dbnSerial);}});byId("close-detail").addEventListener("click",()=>{showDetail=false;editingRecordId=null;renderDetail(null);});byId("detail-backdrop").addEventListener("click",()=>{showDetail=false;editingRecordId=null;renderDetail(null);});
    byId("open-create").addEventListener("click",openCreateModal);byId("close-create").addEventListener("click",closeCreateModal);byId("cancel-create").addEventListener("click",closeCreateModal);byId("create-modal").addEventListener("click",e=>{if(e.target===byId("create-modal"))closeCreateModal();});byId("create-form").addEventListener("submit",createRecord);byId("new-file-button").addEventListener("click",()=>byId("new-file-input").click());byId("new-file-input").addEventListener("change",e=>{const file=e.target.files?.[0];byId("new-file-name").textContent=file?file.name:"尚未選擇檔案";byId("create-message").textContent=file&&!validFailLog(file)?"Fail Log 格式或大小不符；僅接受非空的 .txt／.asc 檔案，最大 5 MB。":"";updateNewFailureDescriptionRequirement();});byId("new-serial").addEventListener("blur",e=>{e.target.value=normalizeSerial(e.target.value);});byId("new-machine").addEventListener("change",updateNewMachine);byId("new-description").addEventListener("change",updateNewBoardPart);byId("open-dbn").addEventListener("click",openDbnModal);byId("close-dbn").addEventListener("click",closeDbnModal);byId("cancel-dbn").addEventListener("click",closeDbnModal);byId("dbn-modal").addEventListener("click",e=>{if(e.target===byId("dbn-modal"))closeDbnModal();});byId("dbn-form").addEventListener("submit",createDbnRecord);byId("dbn-serial").addEventListener("blur",e=>{e.target.value=normalizeSerial(e.target.value);});byId("dbn-machine").addEventListener("change",updateDbnMachine);byId("dbn-board").addEventListener("change",updateDbnPart);byId("dbn-customer").addEventListener("change",updateDbnProducts);byId("dbn-product").addEventListener("change",updateDbnStations);document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!byId("create-modal").hidden)closeCreateModal();if(!byId("dbn-modal").hidden)closeDbnModal();}});
