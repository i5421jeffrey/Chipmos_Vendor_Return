<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPMS — 異動紀錄</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101113;color:#e7e7e8;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1400px;margin:auto;padding:28px 24px}h1{font-size:22px;margin:18px 0 4px}a{color:#b8b8ff}p{color:#88898d}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}label{display:grid;gap:5px;color:#aaa;font-size:11px}input,select,button{font:inherit;color:inherit;background:#191a1c;border:1px solid #343539;border-radius:5px;padding:8px}button{cursor:pointer}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:850px;text-align:left}th{color:#88898d;font-size:11px;font-weight:500}th,td{padding:12px;border-bottom:1px solid #292a2d;vertical-align:top}td{overflow-wrap:anywhere}td:first-child{white-space:nowrap;font-family:ui-monospace,monospace}td:nth-child(5),td:nth-child(6){white-space:pre-wrap;max-width:340px}.status{color:#aaa;margin:12px 0}.pager{display:flex;gap:12px;align-items:center;margin-top:20px}button:disabled{opacity:.45;cursor:default}
  </style>
</head>
<body>
<main>
  <a href="./">← 返回 SPMS</a>
  <h1>異動紀錄</h1>
  <p>集中顯示送修、DBN 與 S/N 主檔異動；紀錄不提供跳轉連結。時間為台灣時間，從啟用紀錄功能後開始保存。</p>
  <form id="filters" class="filters">
    <label>搜尋 S/N、板名、料號或異動內容<input id="query" type="search" maxlength="100"></label>
    <label>資料類型<select id="source"><option value="">全部</option><option value="repair_records">送修</option><option value="dbn_records">DBN</option><option value="serial_board_mappings">S/N 對應</option></select></label>
    <label>操作<select id="operation"><option value="">全部</option><option value="INSERT">新增</option><option value="UPDATE">修改</option><option value="DELETE">刪除</option></select></label>
    <label>開始日期<input id="start" type="date"></label>
    <label>結束日期<input id="end" type="date"></label>
    <button type="submit">查詢／重新整理</button>
  </form>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <div class="table-wrap"><table><thead><tr><th>時間</th><th>類型／操作</th><th>S/N－板件名稱</th><th>變更欄位</th><th>舊值</th><th>新值</th></tr></thead><tbody id="rows"></tbody></table></div>
  <div class="pager"><button id="previous" type="button">上一頁</button><span id="page"></span><button id="next" type="button">下一頁</button></div>
</main>
<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
  const supabase=createClient("https://ywazcutaodqrthhighod.supabase.co","sb_publishable_wu8mVnxG-ifzSDB8Zl4wlg_xCRjl9k3");
  const byId=id=>document.getElementById(id),size=50;
  const sources={repair_records:"送修",dbn_records:"DBN",serial_board_mappings:"S/N 對應"},operations={INSERT:"新增",UPDATE:"修改",DELETE:"刪除"};
  const labels={current_status:"目前狀態",order_status:"開單狀態",is_opened:"是否開單",serial_no:"S/N",description:"板件名稱",board_name:"板件名稱",board_part_code:"Part Number",machine_code:"機台編號",model:"Model",tester_id:"Tester ID",repair_month:"送修月份",item:"項目",area:"區域",failure_tag:"異常標籤",failure_description:"異常描述",failure_data:"異常資料",repair_type:"維修分類",repair_amount:"維修金額",occurred_on:"損壞日期",sent_on:"送修日期",returned_on:"回修日期",closed_on:"結案日期",retry_of_record_id:"前次送修資料 ID",customer_code:"客戶",product_code:"產品",station_code:"站點"};
  let page=0,request=0;
  const timeFormat=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Taipei",year:"2-digit",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"});
  function time(value){const parts=Object.fromEntries(timeFormat.formatToParts(new Date(value)).map(p=>[p.type,p.value]));return `${parts.year}${parts.month}${parts.day} ${parts.hour}:${parts.minute}:${parts.second}`;}
  function value(field,v){if(v===null||v===undefined)return "—";if(field==="is_opened")return v?"已開單":"未開單";if(v==="")return "（空白）";return typeof v==="object"?JSON.stringify(v):String(v);}
  function cell(row,text){const td=document.createElement("td");td.textContent=text;row.append(td);}
  function displayChanges(event){
    const changes=event.changes||{},internal=new Set(["id","version","created_at","updated_at","source_system","source_record_id"]);
    if(event.source_table!=="dbn_records")return Object.entries(changes).filter(([field])=>!internal.has(field));
    const fields=["customer_code","product_code","station_code"];
    if(event.operation==="UPDATE"&&!fields.some(field=>Object.hasOwn(changes,field)))return [];
    function combination(side){
      if((side==="old"&&event.operation==="INSERT")||(side==="new"&&event.operation==="DELETE"))return "—";
      const snapshot=side==="old"?event.dbn_before:event.dbn_after;
      return fields.map(field=>{
        if(snapshot&&Object.hasOwn(snapshot,field))return snapshot[field]||"-";
        if(Object.hasOwn(changes,field))return changes[field][side]||"-";
        return "（未記錄）";
      }).join("-");
    }
    return [["DBN 組合",{old:combination("old"),new:combination("new")}]];
  }
  async function load(){
    const current=++request,status=byId("status");byId("previous").disabled=true;byId("next").disabled=true;status.textContent="正在載入…";
    const start=byId("start").value,end=byId("end").value;
    if(start&&end&&start>end){status.textContent="開始日期不可晚於結束日期。";return;}
    let query=supabase.from("record_change_history").select("*",{count:"exact"}).order("changed_at",{ascending:false}).order("id",{ascending:false});
    if(byId("source").value)query=query.eq("source_table",byId("source").value);
    if(byId("operation").value)query=query.eq("operation",byId("operation").value);
    if(start)query=query.gte("changed_at",`${start}T00:00:00+08:00`);
    if(end){const next=new Date(`${end}T00:00:00Z`);next.setUTCDate(next.getUTCDate()+1);query=query.lt("changed_at",`${next.toISOString().slice(0,10)}T00:00:00+08:00`);}
    const text=byId("query").value.trim();
    if(text){const pattern=`%${text.replace(/[\\%_]/g,"\\$&")}%`;query=query.ilike("search_text",pattern);}
    try{
      const {data,error,count}=await query.range(page*size,(page+1)*size-1);if(current!==request)return;
      byId("rows").replaceChildren();
      if(error){status.textContent=`讀取失敗：${error.message}。若尚未啟用，請先執行 record_change_history_migration.sql。`;return;}
      for(const event of data||[]){for(const [field,change] of displayChanges(event)){const row=document.createElement("tr");cell(row,time(event.changed_at));cell(row,`${sources[event.source_table]||event.source_table}／${operations[event.operation]||event.operation}`);cell(row,`${event.serial_no||"—"}－${event.board_name||"—"}`);cell(row,labels[field]||field);cell(row,value(field,change.old));cell(row,value(field,change.new));byId("rows").append(row);}}
      status.textContent=count?`共 ${count} 筆原始事件；系統欄位已隱藏，DBN 組合合併顯示。${byId("rows").children.length?"":"本頁沒有可顯示的業務異動。"}`:"沒有符合條件的異動紀錄。";
      byId("page").textContent=`第 ${page+1} 頁`;byId("previous").disabled=page===0;byId("next").disabled=(page+1)*size>=count;
    }catch(error){if(current===request)status.textContent=`讀取失敗：${error.message}`;}
  }
  byId("filters").addEventListener("submit",event=>{event.preventDefault();page=0;load();});
  byId("previous").addEventListener("click",()=>{page=Math.max(0,page-1);load();});byId("next").addEventListener("click",()=>{page++;load();});load();
</script>
</body>
</html>
